<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Project detail — Bagas Pardana Ilham's Personal Sanctuary" />
    <meta name="author" content="Bagas Pardana Ilham" />
    <title>Project — Personal Sanctuary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ebony: '#0f0f0f',
                        mist: '#f5f5f0',
                        pewter: '#9ba1a6',
                    },
                    fontFamily: {
                        display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                        body: ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        soft: '0 20px 45px rgb(0 0 0 / 0.35)',
                    },
                },
            },
        }
    </script>
    <style>
        html {
            scroll-behavior: smooth;
        }

        :root {
            color: #f5f5f0;
            background-color: #050505;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #050505;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 20% 20%, rgba(88, 214, 141, 0.12), transparent 45%),
                radial-gradient(circle at 80% 0%, rgba(103, 172, 255, 0.08), transparent 40%),
                linear-gradient(120deg, rgba(3, 30, 15, 0.65), rgba(5, 5, 5, 0.9));
            filter: blur(0px);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: repeating-linear-gradient(0deg,
                    rgba(255, 255, 255, 0.02),
                    rgba(255, 255, 255, 0.02) 1px,
                    transparent 1px,
                    transparent 2px),
                radial-gradient(circle, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        ::selection {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #101010;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 999px;
        }

        .hero-image {
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 {
            animation-delay: 0.1s;
        }

        .delay-2 {
            animation-delay: 0.2s;
        }

        .delay-3 {
            animation-delay: 0.3s;
        }

        .delay-4 {
            animation-delay: 0.4s;
        }

        .delay-5 {
            animation-delay: 0.5s;
        }
    </style>
</head>

<body class="bg-[#050505] text-mist">
    <div class="min-h-screen bg-[#050505] font-body">
        <canvas id="meteor-shower" class="pointer-events-none fixed inset-0 z-0 h-full w-full opacity-40"></canvas>
        <div class="relative z-10">

            <!-- Header -->
            <header
                class="sticky top-0 z-20 mx-auto flex max-w-6xl flex-col items-start gap-4 border-b border-white/5 bg-[#050505]/85 px-6 pt-8 pb-6 backdrop-blur-md sm:flex-row sm:items-center sm:justify-between sm:gap-6 sm:px-10 sm:pt-12 sm:pb-10 lg:px-12">
                <div>
                    <p class="text-[10px] uppercase tracking-[0.35em] text-pewter sm:text-xs">Bagas Pardana Ilham's</p>
                    <h1 class="font-display text-2xl text-white sm:text-4xl">Personal Sanctuary</h1>
                </div>
                <nav
                    class="flex w-full flex-wrap items-center gap-4 text-xs uppercase tracking-[0.3em] text-pewter sm:w-auto sm:gap-6 sm:text-sm">
                    <a href="index.html" class="hover:text-white">Home</a>
                    <a href="index.html#projects" class="hover:text-white">Projects</a>
                    <a href="index.html#blog" class="hover:text-white">Blog</a>
                </nav>
            </header>

            <!-- Main content rendered by JS -->
            <div id="project-detail-content" class="relative z-10 mx-auto max-w-6xl px-6 pb-20 sm:px-10 lg:px-12">
            </div>

            <!-- Footer -->
            <footer
                class="relative z-10 mx-auto max-w-6xl border-t border-white/5 px-6 pt-8 pb-12 text-[10px] text-pewter sm:text-sm sm:px-10 lg:px-12">
                <div class="flex flex-col items-center gap-4 text-center sm:flex-row sm:justify-between sm:text-left">
                    <p>© <span id="current-year"></span> Bagas Pardana Ilham. Built with pure HTML + Tailwind.</p>
                    <a href="mailto:hello@bagas.studio"
                        class="text-white transition hover:text-pewter">hello@bagas.studio</a>
                </div>
            </footer>
        </div>
    </div>

    <script>
        /* ── Data (shared with index.html) ── */
        const projects = [
            {
                id: 'sonic-trails',
                title: 'Sonic Trails Atlas',
                description:
                    'Mapping my favorite forest runs while syncing their ambience, elevation, and BPM-controlled playlists.',
                longDescription:
                    'Sonic Trails Atlas is an interactive topographic experience that overlays forest running routes with ambient soundscapes. Each trail is mapped with real-time elevation data, synced to BPM-controlled playlists captured during dawn runs. The visualization uses Three.js for terrain rendering and Mapbox for geolocation, with Tone.js powering the audio layer that responds to altitude shifts and pace changes. Every trail tells a story through sound and movement.',
                category: 'Website',
                technologies: ['React', 'Three.js', 'Mapbox', 'Tone.js'],
                image:
                    'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80',
                liveUrl: 'https://atlas.bagas.studio',
                repoUrl: 'https://github.com/bagas/sonic-trails',
                highlights: [
                    'Real-time elevation-to-sound mapping',
                    'BPM sync with running cadence',
                    '3D terrain visualization',
                    'Interactive trail playback mode',
                ],
            },
            {
                id: 'quiet-interfaces',
                title: 'Quiet Interfaces Lab',
                description:
                    'A study of minimal client dashboards with piano-like transitions and a focus on contemplative copy.',
                longDescription:
                    'Quiet Interfaces Lab is a research project exploring the intersection of minimalism and digital motion. It features a collection of dashboard prototypes where every transition is choreographed like a piano phrase—soft attacks, sustained holds, and gentle releases. The lab serves as a testing ground for typography-first layouts, ultra-low-contrast palettes, and breathing-pace animations that encourage focused, calm interaction.',
                category: 'Website',
                technologies: ['Next.js', 'Tailwind', 'Framer Motion'],
                image:
                    'https://images.unsplash.com/photo-1470104240373-bc1812eddc9f?auto=format&fit=crop&w=1600&q=80',
                liveUrl: 'https://quietlab.bagas.studio',
                repoUrl: 'https://github.com/bagas/quiet-interfaces',
                highlights: [
                    'Piano-phrased transition system',
                    'Typography-first dashboard layouts',
                    'Breathing-pace animation engine',
                    'Ultra-low-contrast palette studies',
                ],
            },
            {
                id: 'field-notes',
                title: 'Field Notes Recorder',
                description:
                    'A journaling tool for capturing code experiments, travel sketches, and running stats on a single canvas.',
                longDescription:
                    'Field Notes Recorder unifies daily logging across disciplines—code experiments, travel sketches, and running statistics all live on a single infinite canvas. Built on Remix with Supabase for real-time sync, it uses D3.js for interactive data visualizations and p5.js for freehand digital sketching. The result is a living notebook that grows organically, connecting entries through tags, locations, and temporal proximity.',
                category: 'Mobile App',
                technologies: ['Remix', 'D3.js', 'Supabase', 'p5.js'],
                image:
                    'https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1600&q=80',
                liveUrl: 'https://notes.bagas.studio',
                repoUrl: 'https://github.com/bagas/field-notes',
                highlights: [
                    'Infinite canvas architecture',
                    'Cross-discipline entry unification',
                    'Real-time sync with Supabase',
                    'Interactive data visualizations',
                ],
            },
            {
                id: 'canopy-sensors',
                title: 'Canopy Sensors Mesh',
                description:
                    'An IoT dashboard that listens to humidity, soil, and wind sensors hidden along my favorite forest ridge.',
                longDescription:
                    'Canopy Sensors Mesh is a forest monitoring system that distributes environmental sensors along a mountain ridge trail. Humidity, soil moisture, wind speed, and ambient light readings flow through MQTT to a Svelte dashboard backed by Grafana. The live feed reveals micro-climate patterns that shift with altitude and time of day—data that doubles as inspiration for color palettes and interface pacing in my design work.',
                category: 'IOT',
                technologies: ['Svelte', 'MQTT', 'Grafana'],
                image:
                    'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1600&q=80',
                liveUrl: 'https://canopy.bagas.studio',
                repoUrl: 'https://github.com/bagas/canopy-sensors',
                highlights: [
                    'Distributed sensor mesh network',
                    'Real-time MQTT data streaming',
                    'Micro-climate pattern analysis',
                    'Nature-to-design palette extraction',
                ],
            },
            {
                id: 'studio-automation',
                title: 'Studio Automation Loom',
                description:
                    'Workflow automations that cue piano samples, dim studio lighting, and trigger design system snapshots automatically.',
                longDescription:
                    'Studio Automation Loom weaves together my creative workspace into a single responsive fabric. When a new project starts in Notion, the loom dims studio lights to a warm amber, queues a curated piano playlist, and snapshots the current design system tokens. As milestones complete, lighting shifts cooler and the soundscape evolves. Node-RED orchestrates the physical environment while Zapier handles the digital handoffs between tools.',
                category: 'Automation',
                technologies: ['Node-RED', 'Notion API', 'Zapier'],
                image:
                    'https://images.unsplash.com/photo-1500534310937-5c46b1c16d84?auto=format&fit=crop&w=1600&q=80',
                liveUrl: 'https://loom.bagas.studio',
                repoUrl: 'https://github.com/bagas/studio-automation',
                highlights: [
                    'Environment-responsive workspace',
                    'Milestone-driven lighting shifts',
                    'Automated design system snapshots',
                    'Cross-tool orchestration pipeline',
                ],
            },
            {
                id: 'horizon-ai',
                title: 'Horizon Pulse AI',
                description:
                    'An AI soundscape companion that remixes piano sketches with biometrics captured during endurance runs.',
                longDescription:
                    'Horizon Pulse AI is a generative audio companion that bridges physical movement and musical creation. During endurance runs, it captures heart rate, cadence, and elevation via wearable sensors, then feeds those biometric streams into an AI model that remixes my piano sketches in real-time. The result is a unique soundtrack for every run—one that literally breathes with you. Post-run, the generated compositions are available for design mood-boarding.',
                category: 'AI',
                technologies: ['Next.js', 'OpenAI', 'Ableton API'],
                image:
                    'https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1600&q=80',
                liveUrl: 'https://horizon.bagas.studio',
                repoUrl: 'https://github.com/bagas/horizon-ai',
                highlights: [
                    'Biometric-driven music generation',
                    'Real-time piano sketch remixing',
                    'Wearable sensor integration',
                    'Post-run composition export',
                ],
            },
        ]

        /* ── Helpers ── */
        document.getElementById('current-year').textContent = new Date().getFullYear()

        const getIdFromUrl = () => new URLSearchParams(window.location.search).get('id')

        const renderNotFound = () => {
            document.title = 'Project not found — Personal Sanctuary'
            document.getElementById('project-detail-content').innerHTML = `
        <div class="flex flex-col items-center justify-center py-32 text-center opacity-0 animate-fade-in-up">
          <p class="text-6xl font-display text-white/20 mb-4">404</p>
          <h2 class="font-display text-2xl text-white mb-3">Project not found</h2>
          <p class="text-pewter mb-8 max-w-md">The project you're looking for doesn't exist or may have been moved.</p>
          <a href="index.html#projects"
            class="rounded-full border border-white/20 px-6 py-3 text-xs uppercase tracking-[0.3em] text-white transition hover:bg-white hover:text-black">
            ← Back to projects
          </a>
        </div>
      `
        }

        const renderProjectDetail = (project) => {
            document.title = `${project.title} — Personal Sanctuary`

            // Update meta description
            const metaDesc = document.querySelector('meta[name="description"]')
            if (metaDesc) metaDesc.setAttribute('content', project.description)

            document.getElementById('project-detail-content').innerHTML = `
        <!-- Back link -->
        <div class="pt-8 sm:pt-12 opacity-0 animate-fade-in-up">
          <a href="index.html#projects"
            class="inline-flex items-center gap-2 text-sm text-pewter transition hover:text-white group">
            <span class="inline-block transition-transform group-hover:-translate-x-1">←</span>
            Back to projects
          </a>
        </div>

        <!-- Hero image -->
        <div class="mt-8 relative overflow-hidden rounded-[2.5rem] border border-white/5 shadow-soft opacity-0 animate-fade-in-up delay-1">
          <div class="relative h-[320px] sm:h-[420px] lg:h-[480px] overflow-hidden">
            <img
              src="${project.image}"
              alt="${project.title} screenshot"
              class="h-full w-full object-cover hero-image"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-[#050505] via-[#050505]/30 to-transparent"></div>
            <div class="absolute bottom-6 left-8 sm:bottom-8 sm:left-10">
              <span class="rounded-full border border-white/20 bg-white/10 px-4 py-1.5 text-xs uppercase tracking-[0.3em] text-white/90 backdrop-blur-sm">
                ${project.category}
              </span>
            </div>
          </div>
        </div>

        <!-- Content -->
        <div class="mt-10 sm:mt-14 grid gap-12 lg:grid-cols-[1.4fr_0.6fr] lg:gap-16">
          <!-- Left column -->
          <div class="space-y-8 opacity-0 animate-fade-in-up delay-2">
            <div>
              <h2 class="font-display text-3xl sm:text-4xl lg:text-5xl text-white leading-tight">${project.title}</h2>
              <p class="mt-4 text-lg leading-relaxed text-pewter">${project.description}</p>
            </div>
            <div class="space-y-4">
              <p class="text-xs uppercase tracking-[0.4em] text-pewter">About this project</p>
              <p class="text-base leading-[1.8] text-pewter/90">${project.longDescription}</p>
            </div>
            ${project.highlights ? `
            <div class="space-y-4">
              <p class="text-xs uppercase tracking-[0.4em] text-pewter">Key highlights</p>
              <ul class="grid gap-3 sm:grid-cols-2">
                ${project.highlights.map(h => `
                  <li class="flex items-start gap-3 rounded-2xl border border-white/5 bg-white/[0.03] px-5 py-4 text-sm text-pewter">
                    <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-white/10 text-[10px] text-white">✦</span>
                    ${h}
                  </li>
                `).join('')}
              </ul>
            </div>
            ` : ''}
          </div>

          <!-- Right column (sidebar) -->
          <div class="space-y-6 opacity-0 animate-fade-in-up delay-3">
            <!-- Tech stack card -->
            <div class="rounded-[2rem] border border-white/10 bg-white/5 p-6 space-y-4">
              <p class="text-xs uppercase tracking-[0.4em] text-pewter">Technology stack</p>
              <ul class="flex flex-wrap gap-2">
                ${project.technologies.map(tech => `
                  <li class="rounded-full border border-white/15 px-4 py-1.5 text-sm text-pewter">${tech}</li>
                `).join('')}
              </ul>
            </div>

            <!-- Links card -->
            <div class="rounded-[2rem] border border-white/10 bg-white/5 p-6 space-y-4">
              <p class="text-xs uppercase tracking-[0.4em] text-pewter">Links</p>
              <div class="flex flex-col gap-3">
                <a href="${project.liveUrl}" target="_blank" rel="noreferrer"
                  class="flex items-center justify-center rounded-full border border-white/30 px-5 py-3 text-sm text-white transition hover:bg-white hover:text-black">
                  Live space →
                </a>
                <a href="${project.repoUrl}" target="_blank" rel="noreferrer"
                  class="flex items-center justify-center rounded-full border border-white/10 px-5 py-3 text-sm text-white/60 transition hover:border-white/30 hover:text-white">
                  Case notes / Repository
                </a>
              </div>
            </div>
          </div>
        </div>
      `
        }

        /* ── Init ── */
        const projectId = getIdFromUrl()
        const project = projects.find(p => p.id === projectId)

        if (project) {
            renderProjectDetail(project)
        } else {
            renderNotFound()
        }

        /* ── Meteor Shower Animation ── */
        const canvas = document.getElementById('meteor-shower')
        const ctx = canvas.getContext('2d')
        let width, height
        let meteors = []

        const initCanvas = () => {
            width = window.innerWidth
            height = window.innerHeight
            canvas.width = width
            canvas.height = height
        }

        window.addEventListener('resize', initCanvas)
        initCanvas()

        class Meteor {
            constructor() { this.reset() }

            reset() {
                if (Math.random() > 0.5) {
                    this.x = Math.random() * width
                    this.y = -100
                } else {
                    this.x = -100
                    this.y = Math.random() * (height * 0.5)
                }
                this.length = Math.random() * 150 + 80
                this.speed = Math.random() * 10 + 4
                this.angle = (Math.PI / 180) * (Math.random() * 10 + 35)
                this.opacity = Math.random() * 0.4 + 0.1
                this.thickness = Math.random() * 2.5 + 1.5
                this.active = false
                setTimeout(() => { this.active = true }, Math.random() * 5000)
            }

            update() {
                if (!this.active) return
                this.x += this.speed * Math.cos(this.angle)
                this.y += this.speed * Math.sin(this.angle)
                if (this.x > width + 200 || this.y > height + 200) {
                    this.active = false
                    setTimeout(() => { this.reset(); this.active = true }, Math.random() * 4000 + 1000)
                }
            }

            draw() {
                if (!this.active) return
                const tailX = this.x - this.length * Math.cos(this.angle)
                const tailY = this.y - this.length * Math.sin(this.angle)
                const gradient = ctx.createLinearGradient(tailX, tailY, this.x, this.y)
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0)')
                gradient.addColorStop(0.7, `rgba(255, 255, 255, ${this.opacity * 0.4})`)
                gradient.addColorStop(1, `rgba(255, 255, 255, ${this.opacity})`)
                ctx.beginPath()
                ctx.moveTo(tailX, tailY)
                ctx.lineTo(this.x, this.y)
                ctx.strokeStyle = gradient
                ctx.lineWidth = this.thickness
                ctx.lineCap = 'round'
                ctx.stroke()
                ctx.beginPath()
                ctx.arc(this.x, this.y, this.thickness * 1.5, 0, Math.PI * 2)
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity + 0.15})`
                ctx.fill()
            }
        }

        for (let i = 0; i < 15; i++) { meteors.push(new Meteor()) }

        const animateMeteors = () => {
            ctx.clearRect(0, 0, width, height)
            meteors.forEach(m => { m.update(); m.draw() })
            requestAnimationFrame(animateMeteors)
        }

        animateMeteors()
    </script>
</body>

</html>
