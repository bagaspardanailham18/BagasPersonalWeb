<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create an account at Bagas Pardana Ilham's Personal Sanctuary" />
    <meta name="author" content="Bagas Pardana Ilham" />
    <title>Register — Personal Sanctuary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ebony: '#0f0f0f',
                        mist: '#f5f5f0',
                        pewter: '#9ba1a6',
                    },
                    fontFamily: {
                        display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                        body: ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        soft: '0 20px 45px rgb(0 0 0 / 0.35)',
                    },
                },
            },
        }
    </script>
    <style>
        html {
            scroll-behavior: smooth;
        }

        :root {
            color: #f5f5f0;
            background-color: #050505;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #050505;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 20% 20%, rgba(88, 214, 141, 0.12), transparent 45%),
                radial-gradient(circle at 80% 0%, rgba(103, 172, 255, 0.08), transparent 40%),
                linear-gradient(120deg, rgba(3, 30, 15, 0.65), rgba(5, 5, 5, 0.9));
            filter: blur(0px);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: repeating-linear-gradient(0deg,
                    rgba(255, 255, 255, 0.02),
                    rgba(255, 255, 255, 0.02) 1px,
                    transparent 1px,
                    transparent 2px),
                radial-gradient(circle, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        ::selection {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #101010;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 999px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glowPulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.7;
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 {
            animation-delay: 0.1s;
        }

        .delay-2 {
            animation-delay: 0.2s;
        }

        .delay-3 {
            animation-delay: 0.3s;
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.1), transparent 40%, transparent 60%, rgba(103, 172, 255, 0.06));
            pointer-events: none;
            z-index: -1;
        }

        .auth-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 0.875rem 1.25rem;
            color: #f5f5f0;
            font-size: 0.9375rem;
            transition: all 0.3s ease;
            width: 100%;
            outline: none;
        }

        .auth-input::placeholder {
            color: rgba(155, 161, 166, 0.7);
        }

        .auth-input:focus {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
        }

        .auth-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 1rem;
            padding: 0.875rem 1.5rem;
            font-size: 0.8125rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .auth-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .auth-btn:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .auth-btn:hover::before {
            opacity: 1;
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            animation: glowPulse 4s ease-in-out infinite;
        }

        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 1.125rem;
            height: 1.125rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.375rem;
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            flex-shrink: 0;
        }

        .custom-checkbox:checked {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .custom-checkbox:checked::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: white;
        }

        .divider-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(155, 161, 166, 0.7);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.25rem;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: white;
        }

        .strength-bar {
            height: 3px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            transition: all 0.3s;
        }

        .strength-bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.4s ease, background 0.4s ease;
            width: 0%;
        }
    </style>
</head>

<body class="bg-[#050505] text-mist font-body">
    <canvas id="meteor-shower" class="pointer-events-none fixed inset-0 z-0 h-full w-full opacity-40"></canvas>

    <div class="relative z-10 flex min-h-screen flex-col items-center justify-center px-6 py-12">

        <!-- Decorative glow orbs -->
        <div class="glow-orb -top-20 right-10 h-60 w-60 bg-blue-500/15" style="animation-delay: 0s;"></div>
        <div class="glow-orb -bottom-20 -left-20 h-72 w-72 bg-emerald-500/15" style="animation-delay: 2s;"></div>

        <!-- Back to home -->
        <a href="index.html"
            class="absolute top-6 left-6 sm:top-10 sm:left-10 inline-flex items-center gap-2 text-sm text-pewter transition hover:text-white group opacity-0 animate-fade-in-up z-20">
            <span class="inline-block transition-transform group-hover:-translate-x-1">←</span>
            Home
        </a>

        <!-- Register Card -->
        <div
            class="glass-card relative w-full max-w-md rounded-[2.5rem] p-8 sm:p-10 shadow-soft opacity-0 animate-fade-in-up delay-1">

            <!-- Header -->
            <div class="text-center space-y-3 mb-10">
                <p class="text-[10px] uppercase tracking-[0.4em] text-pewter sm:text-xs">Begin your journey at</p>
                <h1 class="font-display text-3xl sm:text-4xl text-white">Personal Sanctuary</h1>
                <p class="text-sm text-pewter leading-relaxed">Create an account to join the space</p>
            </div>

            <!-- Form -->
            <form id="register-form" class="space-y-5" onsubmit="return false;">
                <!-- Full Name -->
                <div class="space-y-2">
                    <label for="fullname" class="block text-xs uppercase tracking-[0.3em] text-pewter">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Bagas Pardana Ilham"
                        class="auth-input" required autocomplete="name" />
                </div>

                <!-- Email -->
                <div class="space-y-2">
                    <label for="email" class="block text-xs uppercase tracking-[0.3em] text-pewter">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" class="auth-input" required
                        autocomplete="email" />
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label for="password" class="block text-xs uppercase tracking-[0.3em] text-pewter">Password</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" placeholder="Create a strong password"
                            class="auth-input pr-16" required autocomplete="new-password"
                            oninput="updateStrength(this.value)" />
                        <button type="button" class="password-toggle"
                            onclick="togglePassword('password', this)">Show</button>
                    </div>
                    <!-- Strength bar -->
                    <div class="strength-bar mt-2">
                        <div id="strength-fill" class="strength-bar-fill"></div>
                    </div>
                    <p id="strength-label" class="text-[11px] text-pewter/60 mt-1"></p>
                </div>

                <!-- Confirm Password -->
                <div class="space-y-2">
                    <label for="confirm-password" class="block text-xs uppercase tracking-[0.3em] text-pewter">Confirm
                        Password</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" name="confirm-password"
                            placeholder="Re-enter your password" class="auth-input pr-16" required
                            autocomplete="new-password" />
                        <button type="button" class="password-toggle"
                            onclick="togglePassword('confirm-password', this)">Show</button>
                    </div>
                </div>

                <!-- Terms -->
                <div class="flex items-start gap-3 pt-1">
                    <input type="checkbox" id="terms" class="custom-checkbox mt-0.5" required />
                    <label for="terms" class="text-sm text-pewter leading-relaxed cursor-pointer">
                        I agree to the <a href="#" class="text-white hover:text-pewter transition">Terms of Service</a>
                        and <a href="#" class="text-white hover:text-pewter transition">Privacy Policy</a>
                    </label>
                </div>

                <!-- Submit -->
                <div class="pt-3">
                    <button type="submit" class="auth-btn">Create Account</button>
                </div>
            </form>

            <!-- Divider -->
            <div class="my-8 divider-line"></div>

            <!-- Login link -->
            <p class="text-center text-sm text-pewter">
                Already have an account?
                <a href="login.html" class="text-white font-medium transition hover:text-pewter ml-1">Sign in →</a>
            </p>
        </div>

        <!-- Branding footer -->
        <p class="mt-8 text-[10px] uppercase tracking-[0.35em] text-pewter/50 opacity-0 animate-fade-in-up delay-3">
            © <span id="current-year"></span> Bagas Pardana Ilham
        </p>
    </div>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear()

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId)
            if (input.type === 'password') {
                input.type = 'text'
                btn.textContent = 'Hide'
            } else {
                input.type = 'password'
                btn.textContent = 'Show'
            }
        }

        function updateStrength(value) {
            const fill = document.getElementById('strength-fill')
            const label = document.getElementById('strength-label')
            let score = 0

            if (value.length >= 6) score++
            if (value.length >= 10) score++
            if (/[A-Z]/.test(value)) score++
            if (/[0-9]/.test(value)) score++
            if (/[^A-Za-z0-9]/.test(value)) score++

            const levels = [
                { width: '0%', color: '', text: '' },
                { width: '20%', color: '#ef4444', text: 'Very weak' },
                { width: '40%', color: '#f97316', text: 'Weak' },
                { width: '60%', color: '#eab308', text: 'Fair' },
                { width: '80%', color: '#22c55e', text: 'Strong' },
                { width: '100%', color: '#10b981', text: 'Very strong' },
            ]

            const level = value.length === 0 ? levels[0] : levels[Math.min(score, 5)]
            fill.style.width = level.width
            fill.style.background = level.color
            label.textContent = level.text
            label.style.color = level.color
        }

        // Meteor Shower Animation
        const canvas = document.getElementById('meteor-shower')
        const ctx = canvas.getContext('2d')
        let width, height
        let meteors = []

        const initCanvas = () => {
            width = window.innerWidth
            height = window.innerHeight
            canvas.width = width
            canvas.height = height
        }

        window.addEventListener('resize', initCanvas)
        initCanvas()

        class Meteor {
            constructor() { this.reset() }
            reset() {
                if (Math.random() > 0.5) {
                    this.x = Math.random() * width
                    this.y = -100
                } else {
                    this.x = -100
                    this.y = Math.random() * (height * 0.5)
                }
                this.length = Math.random() * 150 + 80
                this.speed = Math.random() * 10 + 4
                this.angle = (Math.PI / 180) * (Math.random() * 10 + 35)
                this.opacity = Math.random() * 0.4 + 0.1
                this.thickness = Math.random() * 2.5 + 1.5
                this.active = false
                setTimeout(() => { this.active = true }, Math.random() * 5000)
            }
            update() {
                if (!this.active) return
                this.x += this.speed * Math.cos(this.angle)
                this.y += this.speed * Math.sin(this.angle)
                if (this.x > width + 200 || this.y > height + 200) {
                    this.active = false
                    setTimeout(() => { this.reset(); this.active = true }, Math.random() * 4000 + 1000)
                }
            }
            draw() {
                if (!this.active) return
                const tailX = this.x - this.length * Math.cos(this.angle)
                const tailY = this.y - this.length * Math.sin(this.angle)
                const gradient = ctx.createLinearGradient(tailX, tailY, this.x, this.y)
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0)')
                gradient.addColorStop(0.7, `rgba(255, 255, 255, ${this.opacity * 0.4})`)
                gradient.addColorStop(1, `rgba(255, 255, 255, ${this.opacity})`)
                ctx.beginPath()
                ctx.moveTo(tailX, tailY)
                ctx.lineTo(this.x, this.y)
                ctx.strokeStyle = gradient
                ctx.lineWidth = this.thickness
                ctx.lineCap = 'round'
                ctx.stroke()
                ctx.beginPath()
                ctx.arc(this.x, this.y, this.thickness * 1.5, 0, Math.PI * 2)
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity + 0.15})`
                ctx.fill()
            }
        }

        for (let i = 0; i < 15; i++) { meteors.push(new Meteor()) }

        const animateMeteors = () => {
            ctx.clearRect(0, 0, width, height)
            meteors.forEach(m => { m.update(); m.draw() })
            requestAnimationFrame(animateMeteors)
        }
        animateMeteors()
    </script>
</body>

</html>
